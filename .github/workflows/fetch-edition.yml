name: Fetch headlines
# 공개 RSS 헤드라인을 모아 회차를 만든다 (AI·API 비용 없음). 요약까지 한 회차가 이미 있으면 덮어쓰지 않는다.
# 매일 한국 시간 06:40, 18:40 (UTC 21:40, 09:40)
on:
  workflow_dispatch:
    inputs:
      replace:
        description: '같은 회차가 있어도 새로 만들어 덮어쓰기 (feeds 를 바꾼 뒤 시험용)'
        type: boolean
        default: false
  schedule:
    - cron: '40 21 * * *'
    - cron: '40 9 * * *'

permissions:
  contents: write

concurrency:
  group: fetch-edition
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node scripts/fetch-rss.mjs
        env:
          REPLACE: ${{ inputs.replace && '1' || '0' }}
      - run: node scripts/build-index.mjs
      - run: node scripts/validate.mjs
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "정회창"
          git config user.email "81364742+hwet-j@users.noreply.github.com"
          git add data
          git commit -m "data: 헤드라인 자동 수집 ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
