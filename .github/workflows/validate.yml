name: Validate data
on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']
  pull_request:
    paths: ['data/**', 'scripts/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node scripts/validate.mjs
