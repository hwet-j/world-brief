name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'ccr-*']
    paths: ['app/**', '.github/workflows/build-apk.yml']   # 데이터(data/**) 푸시로는 APK 를 빌드하지 않는다

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint & test
        run: |
          npx tsc --noEmit
          npx eslint .
          for tz in Asia/Seoul America/Los_Angeles UTC; do TZ=$tz npx jest; done

      - name: Generate native Android project (CNG)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64)
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/world-brief-${GITHUB_RUN_NUMBER}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: world-brief-apk
          path: app/out/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 간헐적인 403(권한 전파 지연)에 대비해 최대 3회 재시도
          for i in 1 2 3; do
            gh release create "apk-${GITHUB_RUN_NUMBER}" out/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "World Brief APK #${GITHUB_RUN_NUMBER}" \
              --notes "폰에서 이 APK를 받아 설치하세요. (설정에서 '출처를 알 수 없는 앱 설치' 허용 필요) 커밋: ${GITHUB_SHA::7}" && exit 0
            echo "릴리스 생성 실패 ($i/3), 20초 후 재시도"; sleep 20
          done
          exit 1
